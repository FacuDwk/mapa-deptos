      --border: #e5e7eb;
      --accent: #2563eb;
      --alta: #10b981;
      --media: #f59e0b;
      --baja: #64748b;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;

      background: var(--bg);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--header);
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
      z-index: 1000;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    .brand span { font-size: 12px; color: #9ca3af; }
    .stats-bar { display: flex; gap: 14px; align-items: center; font-size: 12px; flex-wrap: wrap; }
    .stat-pill {
      background: rgba(255,255,255,0.1);
      padding: 4px 10px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .stat-pill strong { color: #93c5fd; font-weight: 700; }
    .hdr-actions { display: flex; gap: 8px; align-items: center; }
    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-ghost {
      background: rgba(255,255,255,0.12);
      color: #f3f4f6;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.22); }

    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
      position: relative;
    }
    aside {
      width: 390px;
      max-width: 92vw;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      transition: margin-left 0.2s ease;
      z-index: 900;
    }
    aside.collapsed { margin-left: -390px; }

    .filters {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex-shrink: 0;
    }
    .search-box {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 13px;
      outline: none;
    }
    .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,0.12); }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .filter-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .filter-group select {
      width: 100%;
      padding: 5px 7px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      background: #fff;
    }
    .slider-wrap { display: flex; flex-direction: column; gap: 3px; }
    .slider-head { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--muted); }
    .slider-head strong { color: var(--text); }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

    .checks {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      align-items: center;
    }
    .checks label { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }

    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--muted);
      padding-top: 2px;
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.2); }

    .list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 11px;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .card:hover { border-color: #93c5fd; box-shadow: 0 2px 6px rgba(37,99,235,0.08); }
    .card.active { border-color: var(--accent); background: #eff6ff; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
    .card-title { font-size: 13px; font-weight: 700; color: #111827; line-height: 1.25; }
    .row-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      background: #e5e7eb;
      color: #374151;
      flex-shrink: 0;
    }
    .card-price { font-size: 13px; font-weight: 700; color: #059669; margin-bottom: 4px; }
    .card-price span { font-weight: 500; color: var(--muted); font-size: 11px; margin-left: 4px; }
    .badges { display: flex; flex-wrap: wrap; gap: 4px; }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #f3f4f6;
      color: #374151;
      font-weight: 600;
    }
    .badge.alta { background: #d1fae5; color: #065f46; }
    .badge.media { background: #fef3c7; color: #92400e; }
    .badge.baja { background: #e2e8f0; color: #475569; }
    .badge.gas-si { background: #dbeafe; color: #1e40af; }
    .badge.gas-no { background: #fee2e2; color: #991b1b; }
    .badge.approx { background: #ede9fe; color: #5b21b6; }

    #map { flex: 1; width: 100%; height: 100%; }

    .leaflet-popup-content-wrapper { border-radius: 10px; padding: 2px; }

    .pop-price { font-size: 15px; font-weight: 800; color: #059669; margin-bottom: 6px; }

      font-weight: 600;
      font-size: 11.5px;

      height: 24px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.35);

      font-size: 10px;
      font-weight: 700;

      align-items: center;
      justify-content: center;
      transition: transform 0.12s;

      border-radius: 50%;
      font-size: 13px;
      font-weight: 700;

      justify-content: center;

    function applyOffsets(list) {
      const coordGroups = {};
      list.forEach(p => {
        if (typeof p.lat !== "number" || typeof p.lon !== "number") return;
        const key = `${p.lat.toFixed(5)}_${p.lon.toFixed(5)}`;
        if (!coordGroups[key]) coordGroups[key] = [];
        coordGroups[key].push(p);
      });
      Object.values(coordGroups).forEach(group => {
        if (group.length === 1) {
          group[0].dLat = group[0].lat;
          group[0].dLon = group[0].lon;
        } else {
          const radius = 0.00013;
          group.forEach((p, idx) => {
            const angle = (2 * Math.PI * idx) / group.length - Math.PI / 2;
            p.dLat = p.lat + radius * Math.sin(angle);
            p.dLon = p.lon + radius * Math.cos(angle) * 1.15;
          });
        }
      });

      } else {
        el.innerHTML = `
          <span class="legend-item"><i class="dot" style="background:#10b981"></i>≤ USD 1.150/m²</span>
          <span class="legend-item"><i class="dot" style="background:#f59e0b"></i>1.150 – 1.400</span>
          <span class="legend-item"><i class="dot" style="background:#ef4444"></i>&gt; 1.400 / s/d</span>${refHtml}`;
      }
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function buildPopup(p) {
      const linksHtml = (p.links || []).map(l =>
        `<a class="pop-btn" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)} ↗</a>`
      ).join("");
      const approxBadge = p.approx ? `<span class="badge approx" title="Dirección aproximada sobre la cuadra">Ubic. aprox.</span>` : "";
      const prioCls = (p.priority || "").toLowerCase();
      return `
        <div>
          <div class="pop-head">
            <div class="pop-title">${esc(p.address)}</div>
            <span class="row-tag">Fila ${p.row}</span>
          </div>
          <div class="pop-price">${esc(p.price)} ${p.usdM2 ? `<span style="font-size:12px;color:#6b7280;font-weight:600">(${esc(p.usdM2)}/m²)</span>` : ""}</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px;">
            <span class="badge ${prioCls}">Prioridad ${esc(p.priority)} (${esc(p.score)}/10)</span>
            ${approxBadge}
          </div>
          <div class="pop-grid">
            <div class="pop-kv"><b>Piso:</b> ${esc(p.floor)}</div>
            <div class="pop-kv"><b>Sup.:</b> ${esc(p.area)}</div>
            <div class="pop-kv"><b>Expensas:</b> ${esc(p.expenses)}</div>
            <div class="pop-kv"><b>Dorm/Baño:</b> ${esc(p.bedrooms)} / ${esc(p.bathrooms)}</div>
            <div class="pop-kv"><b>Gas:</b> ${esc(p.gas)}</div>
            <div class="pop-kv"><b>Lavarropas:</b> ${esc(p.laundry)}</div>
            <div class="pop-kv"><b>Balcón:</b> ${esc(p.balcony)}</div>
            <div class="pop-kv"><b>Disposición:</b> ${esc(p.disposition)}</div>
            <div class="pop-kv" style="grid-column:span 2"><b>Estado:</b> ${esc(p.condition)}</div>
            <div class="pop-kv" style="grid-column:span 2"><b>Contacto:</b> ${esc(p.contact)}</div>
          </div>
          <div class="pop-notes">${esc(p.notes)}</div>
          <div class="pop-links">${linksHtml}</div>
        </div>`;
    }

    function matchesFilters(p) {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const maxP = Number(document.getElementById("maxPrice").value);
      const prio = document.getElementById("priorityFilter").value;
      const gas = document.getElementById("gasFilter").value;
      const bed = document.getElementById("bedFilter").value;
      const chkCred = document.getElementById("chkCredito").checked;
      const chkEsc = document.getElementById("chkEscritura").checked;

      if (p.priceNum && p.priceNum > maxP) return false;
      if (prio !== "all" && p.priority !== prio) return false;

      const gasLow = (p.gas || "").toLowerCase();
      if (gas === "si" && !gasLow.startsWith("sí") && !gasLow.startsWith("si")) return false;
      if (gas === "no" && !gasLow.startsWith("no")) return false;
      if (gas === "verif" && !gasLow.includes("verificar")) return false;

      const bedLow = (p.bedrooms || "").toLowerCase();
      if (bed === "1" && (bedLow.includes("2") || bedLow.includes("1 1/2"))) return false;
      if (bed === "2" && !bedLow.includes("2") && !bedLow.includes("1 1/2")) return false;

      const blob = `${p.address} ${p.notes} ${p.contact} ${p.condition} ${p.gas} fila ${p.row} #${p.row}`.toLowerCase();
      if (chkCred && (!blob.includes("apto crédito") && !blob.includes("apto credito") || blob.includes("no apto crédito") || blob.includes("no apto credito"))) return false;
      if (chkEsc && !blob.includes("escritura")) return false;

      if (q && !blob.includes(q)) return false;
      return true;
    }

    let activeRow = null;

    function selectProperty(row, openPop = true) {
      activeRow = row;
      document.querySelectorAll(".card").forEach(c => {
        c.classList.toggle("active", Number(c.dataset.row) === row);
      });
      const m = markerByRow[row];
      if (m) {
        map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 16), { duration: 0.45 });
        if (openPop) m.openPopup();
      }
    }

    function render() {
      const mode = document.getElementById("colorMode").value;
      updateLegend(mode);
      markersLayer.clearLayers();
      Object.keys(markerByRow).forEach(k => delete markerByRow[k]);

      const filtered = DATA.properties.filter(matchesFilters);

      // Stats
      document.getElementById("statCount").textContent = `${filtered.length} / ${DATA.properties.length}`;
      const priced = filtered.filter(p => p.priceNum);
      const avgP = priced.length ? Math.round(priced.reduce((s, p) => s + p.priceNum, 0) / priced.length) : null;
      const m2d = filtered.filter(p => p.usdM2Num);
      const avgM2 = m2d.length ? Math.round(m2d.reduce((s, p) => s + p.usdM2Num, 0) / m2d.length) : null;
      document.getElementById("statAvgPrice").textContent = avgP ? `USD ${avgP.toLocaleString("es-AR")}` : "-";
      document.getElementById("statAvgM2").textContent = avgM2 ? `USD ${avgM2.toLocaleString("es-AR")}` : "-";

      const listEl = document.getElementById("propList");
      listEl.innerHTML = "";

      filtered.forEach(p => {
        const color = getColor(p, mode);
        const icon = L.divIcon({
          className: "",
          html: `<div class="marker-pin" style="background:${color}">${p.row}</div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12],
          popupAnchor: [0, -12]
        });
        const marker = L.marker([p.dLat, p.dLon], { icon });
        marker.bindTooltip(`#${p.row} · ${p.address} (${p.price})`, { direction: "top", offset: [0, -10] });
        marker.bindPopup(buildPopup(p), { maxWidth: 320 });
        marker.on("click", () => {
          activeRow = p.row;
          document.querySelectorAll(".card").forEach(c => {
            const match = Number(c.dataset.row) === p.row;
            c.classList.toggle("active", match);
            if (match) c.scrollIntoView({ behavior: "smooth", block: "nearest" });
          });
        });
        marker.addTo(markersLayer);
        markerByRow[p.row] = marker;

        const card = document.createElement("div");
        card.className = `card${activeRow === p.row ? " active" : ""}`;
        card.dataset.row = p.row;

        const gasLow = (p.gas || "").toLowerCase();
        const gasBadge = gasLow.startsWith("sí") || gasLow.startsWith("si")
          ? `<span class="badge gas-si">Gas: Sí</span>`
          : (gasLow.startsWith("no") ? `<span class="badge gas-no">Gas: No</span>` : `<span class="badge">Gas: ?</span>`);
        const prioCls = (p.priority || "").toLowerCase();

        card.innerHTML = `
          <div class="card-top">
            <div class="card-title">${esc(p.address)}</div>
            <span class="row-tag">#${p.row}</span>
          </div>
          <div class="card-price">${esc(p.price)} <span>${esc(p.area)} ${p.usdM2 ? `· ${esc(p.usdM2)}/m²` : ""}</span></div>
          <div class="badges">
            <span class="badge ${prioCls}">${esc(p.priority)} (${esc(p.score)})</span>
            ${gasBadge}
            <span class="badge">${esc(p.bedrooms)}</span>
            ${p.approx ? `<span class="badge approx">Aprox.</span>` : ""}
          </div>`;
        card.addEventListener("click", () => selectProperty(p.row, true));
        listEl.appendChild(card);
      });
    }

    function fitVisible() {
      const pts = [];
      markersLayer.eachLayer(l => pts.push(l.getLatLng()));
      if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [36, 36], maxZoom: 16 });
    }

    ["searchInput", "priorityFilter", "gasFilter", "bedFilter", "colorMode", "chkCredito", "chkEscritura"].forEach(id => {
      document.getElementById(id).addEventListener("input", render);
      document.getElementById(id).addEventListener("change", render);
    });
    document.getElementById("maxPrice").addEventListener("input", e => {
      document.getElementById("maxPriceLabel").textContent = `USD ${Number(e.target.value).toLocaleString("es-AR")}`;
      render();
    });
    document.getElementById("chkLandmarks").addEventListener("change", e => {
      if (e.target.checked) landmarksLayer.addTo(map);
      else map.removeLayer(landmarksLayer);
    });
    document.getElementById("fitBtn").addEventListener("click", fitVisible);
    document.getElementById("resetBtn").addEventListener("click", () => {
      document.getElementById("searchInput").value = "";
      document.getElementById("maxPrice").value = 75000;
      document.getElementById("maxPriceLabel").textContent = "USD 75.000";
      document.getElementById("priorityFilter").value = "all";
      document.getElementById("gasFilter").value = "all";
      document.getElementById("bedFilter").value = "all";
      document.getElementById("chkCredito").checked = false;
      document.getElementById("chkEscritura").checked = false;
      render();
      fitVisible();
    });
    document.getElementById("toggleSidebar").addEventListener("click", () => {
      document.getElementById("sidebar").classList.toggle("collapsed");
      setTimeout(() => map.invalidateSize(), 220);
    });

    function getActiveApiUrl() {
      const param = new URLSearchParams(window.location.search).get("api");
      if (param && /^https:\/\/script\.google\.com\//i.test(param.trim())) return param.trim();
      if (APPS_SCRIPT_URL && /^https:\/\//i.test(APPS_SCRIPT_URL.trim())) return APPS_SCRIPT_URL.trim();
      const saved = localStorage.getItem("apps_script_url");
      return saved ? saved.trim() : "";
    }

    async function syncFromSheet(interactive) {
      let url = getActiveApiUrl();
      if (!url) {
        if (!interactive) return;
        const entered = window.prompt("Pegá la URL de aplicación web (/exec) de tu Google Apps Script:", "");
        if (!entered || !entered.trim()) return;
        url = entered.trim();
        localStorage.setItem("apps_script_url", url);
      }

      const statusEl = document.getElementById("syncStatus");
      statusEl.textContent = "Sincronizando...";
      try {
        const resp = await fetch(url, { cache: "no-store" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const json = await resp.json();
        if (!json || !Array.isArray(json.properties)) throw new Error("JSON inválido");

        const validProps = [];
        let missingGeo = 0;
        json.properties.forEach(p => {
          if (typeof p.lat !== "number" || typeof p.lon !== "number") {
            const fb = embeddedCoordsByAddr[String(p.address || "").toLowerCase().trim()];
            if (fb) {
              p.lat = fb.lat;
              p.lon = fb.lon;
              p.approx = fb.approx;
            }
          }
          if (typeof p.lat === "number" && typeof p.lon === "number") {
            validProps.push(p);
          } else {
            missingGeo++;
          }
        });

        if (validProps.length > 0) {
          DATA.properties = validProps;
          applyOffsets(DATA.properties);
          const maxFound = Math.max(75000, ...validProps.map(p => p.priceNum || 0));
          const slider = document.getElementById("maxPrice");
          if (maxFound > Number(slider.max)) {
            slider.max = Math.ceil(maxFound / 1000) * 1000;
            slider.value = slider.max;
            document.getElementById("maxPriceLabel").textContent = `USD ${Number(slider.value).toLocaleString("es-AR")}`;
          }
          render();
          fitVisible();
        }
        const hhmm = new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
        statusEl.textContent = missingGeo > 0 ? `En vivo · ${hhmm} (${missingGeo} sin ubicar)` : `En vivo · ${hhmm}`;
      } catch (err) {
        statusEl.textContent = "Error al actualizar (usando locales)";
        if (interactive) {
          alert("No se pudo conectar con Google Sheets (" + err.message + "). Verificá la URL /exec o los permisos 'Cualquier persona' del Apps Script.");
        }
      }
    }

    document.getElementById("syncBtn").addEventListener("click", () => syncFromSheet(true));

    render();
    fitVisible();
    if (getActiveApiUrl()) syncFromSheet(false);
  </script>
</body>
</html>
